<!DOCTYPE html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0E1B14; --pine:#173229; --moss:#2C5644; --paper:#F3F4EF; --card:#FFFFFF;
      --line:#DDE1D6; --amber:#D99000; --red:#B3402A; --green:#2E7D4F; --mut:#5E6A61;
    }
    *{box-sizing:border-box;margin:0}
    body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);display:flex;min-height:100vh}
    nav{width:210px;background:var(--pine);color:#E8EDE5;padding:22px 0;flex-shrink:0;display:flex;flex-direction:column}
    .logo{font-family:'Archivo';font-weight:800;font-size:19px;padding:0 20px 18px;letter-spacing:.5px}
    .logo span{color:#8FD6A9}
    nav button{all:unset;cursor:pointer;padding:11px 20px;font-size:14px;font-weight:500;color:#B9C6BC;border-left:3px solid transparent}
    nav button:hover{color:#fff}
    nav button.on{color:#fff;background:rgba(255,255,255,.06);border-left-color:#8FD6A9}
    nav button:focus-visible{outline:2px solid #8FD6A9;outline-offset:-2px}
    .count{background:#8FD6A9;color:var(--pine);border-radius:9px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:8px}
    main{flex:1;padding:26px 30px;max-width:1200px}
    h1{font-family:'Archivo';font-weight:700;font-size:22px;margin-bottom:16px}
    h2{font-family:'Archivo';font-weight:700;font-size:16px;margin:18px 0 8px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
    td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:none}
    .chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 10px}
    .c-sub{background:#E2F2E7;color:var(--green)} .c-prog{background:#FFF3D6;color:var(--amber)}
    .c-fail{background:#FBE4DE;color:var(--red)} .c-wait{background:#E7E9F5;color:#3D4A9E}
    .c-cap{background:#FBE4DE;color:var(--red);border:1px dashed var(--red)}
    .rail{display:flex;gap:4px;margin-top:5px}
    .rail i{width:22px;height:5px;border-radius:3px;background:var(--line)}
    .rail i.done{background:var(--moss)}
    .btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:7px;padding:7px 14px;cursor:pointer}
    .approve{background:var(--moss);color:#fff} .reject{background:#fff;color:var(--red);border:1px solid var(--red)}
    .primary{background:var(--pine);color:#fff}
    .danger{background:#fff;color:var(--red);border:1px solid var(--red)}
    .tiny{padding:4px 10px;font-size:12px}
    .btn:focus-visible{outline:2px solid var(--amber)}
    .findings{font-family:'IBM Plex Mono';font-size:11.5px;background:#F7F8F4;border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap;max-height:150px;overflow:auto;margin-top:8px}
    input,textarea,select{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:8px;width:100%;background:#fff}
    textarea{min-height:130px;resize:vertical}
    label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    .stat b{font-family:'Archivo';font-size:24px;display:block}
    .stat span{font-size:12px;color:var(--mut)}
    .mut{color:var(--mut);font-size:12.5px}
    .tog{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
    .tog input{width:auto}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
    .filters > div{flex:1;min-width:130px}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
    .pager .pg{display:flex;align-items:center;gap:6px}
    .pager select{width:auto;padding:4px 6px}
    .pager .btn{background:#fff;color:var(--pine);border:1px solid var(--line)}
    .pager .btn:disabled{opacity:.45;cursor:default}
    .faq{border-bottom:1px solid var(--line);padding:10px 0}
    .faq summary{font-weight:600;cursor:pointer;font-size:14px}
    .faq p, .faq li{font-size:13.5px;color:#33413A;line-height:1.55;margin-top:6px}
    .steps{counter-reset:step;list-style:none;padding:0}
    .steps li{position:relative;padding:8px 0 8px 34px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line)}
    .steps li:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:8px;width:22px;height:22px;background:var(--moss);color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
    #toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none}
    @media (max-width:760px){nav{width:64px}.logo{font-size:12px;padding:0 8px 14px}nav button{padding:11px 10px;font-size:11px}main{padding:16px}}
  </style>
</head>
<body>
  <nav>
    <div class="logo">JOB<span>VERSE</span></div>
    <button data-v="reviews" class="on">Review queue <span class="count" id="revCount">0</span></button>
    <button data-v="candidates">Candidates</button>
    <button data-v="applications">Applications</button>
    <button data-v="generate">Generate</button>
    <button data-v="prospects">Prospects</button>
    <button data-v="followups">Follow-ups</button>
    <button data-v="accounts">Site accounts</button>
    <button data-v="report">Reports</button>
    <button data-v="log">Activity</button>
    <button data-v="help">Help &amp; guide</button>
  </nav>
  <main id="main"><h1>Loading…</h1></main>
  <div id="toast"></div>
 
<script>
// Passed back on every server call - each dash* function re-checks it (see doGet in Api.gs)
const DASH_KEY = <?!= JSON.stringify(dashKey) ?>;
let D = null, view = 'reviews';
const F = {}; // per-view filter state

// Persist the selected candidate for finding jobs across page refreshes
function saveFindJobsCandidate(candId) {
  localStorage.setItem('jobverse_findJobs_candidate', candId);
}

function loadFindJobsCandidate() {
  return localStorage.getItem('jobverse_findJobs_candidate');
}

function clearFindJobsCandidate() {
  localStorage.removeItem('jobverse_findJobs_candidate');
}

// Test function - call from browser console: testQueueAllData()
function testQueueAllData() {
  console.log('=== TEST QUEUE ALL DATA ===');
  console.log('Current view:', view);
  console.log('F.pCand:', F.pCand);
  console.log('localStorage candidate:', loadFindJobsCandidate());
  console.log('All candidates:', D.candidates.map(c => ({ id: c.id, name: c.name })));
  console.log('All prospects count:', D.prospects.length);
  
  const prospectsForCand = D.prospects.filter(p => p.cand === (F.pCand || loadFindJobsCandidate()));
  console.log('Prospects for selected candidate:', prospectsForCand.length);
  console.log('Breakdown:');
  console.log('  - Status "Found":', prospectsForCand.filter(p => p.status === 'Found').length);
  console.log('  - Status "Found - Manual Review":', prospectsForCand.filter(p => p.status === 'Found - Manual Review').length);
  console.log('  - Other statuses:', prospectsForCand.map(p => p.status).filter((s, i, a) => a.indexOf(s) === i && s !== 'Found' && s !== 'Found - Manual Review'));
  console.log('Sample prospects:', prospectsForCand.slice(0, 3).map(p => ({ id: p.id, company: p.company, status: p.status })));
  console.log('============================');
}
 
// background = the periodic refresh (or a refresh after an action): the data is
// updated, but the page is only redrawn if that won't wipe something being typed.
function load(background){
  google.script.run
    .withSuccessHandler(d => {
      D = d;
      if(background && userIsEditing()) { document.getElementById('revCount').textContent = D.reviews.length; return; }
      render();
    })
    .withFailureHandler(e => {
      if(background) { console.warn('Background refresh failed:', e.message); return; }
      document.getElementById('main').innerHTML =
        `<h1>Connection error</h1><div class="card"><p style="color:var(--red);font-weight:600">${esc(e.message)}</p>
         <p class="mut" style="margin-top:8px">The backend threw an error. Check Apps Script's Executions panel (clock icon) for the full stack trace.</p></div>`;
    })
    .dashData(DASH_KEY);
}
load(); setInterval(() => load(true), 45000);

/** True while redrawing would lose the user's input: the Generate form, or any focused field. */
function userIsEditing(){
  if(view === 'generate') return true; // its form holds typed text and nothing on it needs live data
  const a = document.activeElement;
  return !!a && document.getElementById('main').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
 
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
 
function esc(s){ return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function chip(s){
  s = String(s || '');
  const cls = s.includes('Submitted') ? 'c-sub' : s.includes('CAPTCHA') ? 'c-cap'
    : (s.includes('Failed') || s.includes('Rejected') || s.includes('Error')) ? 'c-fail'
    : s.includes('Review') ? 'c-wait' : 'c-prog';
  return `<span class="chip ${cls}">${esc(s)}</span>`;
}
function rail(status){
  const stages = ['In Progress','Awaiting Review','Approved - Submitting','Submitted'];
  const idx = stages.indexOf(status === 'Approved - Extension' ? 'Approved - Submitting' : status);
  return '<div class="rail">' + stages.map((s,i) =>
    `<i class="${idx >= i ? 'done':''}" title="${s}"></i>`).join('') + '</div>';
}
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2600); }
function uniq(arr){ return [...new Set(arr.filter(Boolean))]; }
function opts(arr, sel){ return ['<option value="">All</option>'].concat(arr.map(v => `<option ${v===sel?'selected':''}>${esc(v)}</option>`)).join(''); }
 
function render(){
  if(!D) return;
  document.getElementById('revCount').textContent = D.reviews.length;
  const m = document.getElementById('main');
 
  if(view === 'reviews'){
    // Newest first. The sheet is oldest-first, so reversing it first keeps undated rows newest-first too.
    const reviews = D.reviews.slice().reverse().sort((a, b) => (b.createdMs || 0) - (a.createdMs || 0));
    const pg = paginate(reviews, 'revPage', F.revSize || 10);
    m.innerHTML = '<h1>Review queue</h1>' + (reviews.length ? '' :
      '<p class="mut">Nothing waiting. New CVs, cover letters, NHS statements and paused submissions appear here.</p>') +
      pg.rows.map(t => `
        <div class="card">
          <b>${esc(t.summary)}</b> <span class="mut">${esc(t.type)} · ${esc(t.cand)} · score ${esc(t.score||'-')}</span>
          <div style="margin-top:6px"><button class="btn tiny" style="background:#fff;color:var(--pine);border:1px solid var(--line)"
            onclick="toggleFindings('${t.id}')">${OPEN_FINDINGS.has(t.id) ? 'Hide details' : 'Show details'}</button></div>
          ${OPEN_FINDINGS.has(t.id) ? (FINDINGS[t.id] == null
            ? '<div class="findings">Loading…</div>' : renderFindings(FINDINGS[t.id])) : ''}
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
            <button class="btn approve" onclick="decide('${t.id}','approve')">Approve</button>
            <button class="btn reject" onclick="decide('${t.id}','revise')">Send back</button>
            <span class="mut">${t.type === 'Submission'
              ? 'Send back = not submitted (you can Retry it from Applications)'
              : 'Send back = a new version is written from your notes and returns here'}</span>
          </div>
        </div>`).join('') +
      (reviews.length ? `<div class="card">${pagerHtml(pg, 'revPage', 'revSize', [10, 25, 50])}</div>` : '');
  }
 
  if(view === 'candidates'){
    m.innerHTML = '<h1>Candidates</h1><div class="card"><table><tr><th>Name</th><th>Target roles</th><th>Progress</th><th>Target</th><th>Active</th><th></th></tr>' +
      D.candidates.map(c => {
        const pct = c.target > 0 ? Math.min(100, Math.round(100 * c.applied / c.target)) : 0;
        return `<tr>
          <td><b>${esc(c.name)}</b><br><span class="mut">${esc(c.id)} · ${esc(c.status)}</span></td>
          <td>${esc(c.roles)}</td>
          <td>${c.applied}${c.target>0?' / '+c.target:''}
            ${c.target>0?`<div class="rail" style="margin-top:4px"><i class="done" style="width:${pct}%;max-width:100%"></i></div>`:''}
          </td>
          <td><input type="number" min="0" value="${c.target}" style="width:70px;padding:4px" onchange="setTarget('${c.id}', this.value)"></td>
          <td><label class="tog"><input type="checkbox" ${c.active?'checked':''} onchange="setActive('${c.id}', this.checked)"> <span>${c.active?'Active':'Inactive'}</span></label></td>
          <td><button class="btn danger tiny" onclick="delCandidate('${c.id}','${esc(c.name).replace(/'/g,"")}')">Delete</button></td>
        </tr>`;
      }).join('') +
      '</table></div>';
  }
 
  if(view === 'applications'){
    const cands = uniq(D.applications.map(a => a.cand));
    const statuses = uniq(D.applications.map(a => a.status));
    let rows = D.applications.slice().reverse();
    if(F.appCand) rows = rows.filter(a => a.cand === F.appCand);
    if(F.appStatus) rows = rows.filter(a => a.status === F.appStatus);
    m.innerHTML = '<h1>Applications</h1>' +
      `<div class="filters">
        <div><label>Candidate</label><select onchange="setFilter('appCand',this.value)">${opts(cands, F.appCand)}</select></div>
        <div><label>Status</label><select onchange="setFilter('appStatus',this.value)">${opts(statuses, F.appStatus)}</select></div>
       </div>` +
      '<div class="card"><table><tr><th>Company / role</th><th>Candidate</th><th>ATS</th><th>Pipeline</th><th>Status</th><th>Proof</th><th></th></tr>' +
      (rows.length ? rows.map(a => `<tr>
        <td><b>${esc(a.company)}</b><br><span class="mut">${esc(a.title)}</span></td>
        <td class="mut">${esc(a.cand)}</td><td>${esc(a.ats)}</td>
        <td>${rail(a.status)}</td><td>${chip(a.status)}</td>
        <td>${a.shot ? `<a href="${esc(a.shot)}">screenshot</a>` : '<span class="mut">-</span>'}</td>
        <td>${(a.status==='Failed'||a.status==='Error'||a.status==='Rejected')?`<button class="btn primary tiny" onclick="retryApp('${a.id}')">Retry</button>`:''}</td></tr>`).join('')
        : '<tr><td colspan="7" class="mut">No applications match.</td></tr>') +
      '</table></div>';
  }
 
  if(view === 'generate'){
    m.innerHTML = `<h1>Generate CV + cover letter</h1>
      <div class="card">
        <label>Candidate</label>
        <select id="gCand">${D.candidates.map(c => `<option value="${esc(c.id)}">${esc(c.name)} (${esc(c.id)})</option>`).join('')}</select>
        <label>Job URL (optional)</label><input id="gUrl" placeholder="https://...">
        <label>Paste the job description</label><textarea id="gJD"></textarea>
        <label>Tone profile</label>
        <select id="gTone"><option>Jobverse Standard</option><option>NHS</option><option>Corporate</option><option>Technical</option><option>Executive</option><option>Graduate</option></select>
        <div style="margin-top:12px"><button class="btn primary" onclick="gen()">Generate documents</button> <span class="mut" id="gMsg"></span></div>
      </div>`;
  }
 
  if(view === 'prospects'){
    // Restore the persisted candidate selection from localStorage
    const persistedCand = loadFindJobsCandidate();
    if(persistedCand && D.candidates.some(c => c.id === persistedCand)) {
      F.pCand = persistedCand;
    } else if(D.candidates.length && !D.candidates.some(c => c.id === F.pCand)) {
      F.pCand = D.candidates[0].id;
    }
    const cands = uniq(D.prospects.map(p => p.cand));
    const statuses = uniq(D.prospects.map(p => p.status));
    let rows = D.prospects;
    if(F.prosCand) rows = rows.filter(p => p.cand === F.prosCand);
    if(F.prosStatus) rows = rows.filter(p => p.status === F.prosStatus);

    // Sort by the day the job was found. Rows with no FoundAt always go last.
    const sort = F.prosSort || 'newest';
    const dir = sort === 'oldest' ? 1 : -1;
    rows = rows.slice().sort((a, b) => {
      if(!a.found !== !b.found) return a.found ? -1 : 1;
      return (a.found - b.found) * dir;
    });

    const pg = paginate(rows, 'prosPage', F.prosSize || 25);
    const pageRows = pg.rows, total = pg.total;
    m.innerHTML = `<h1>Prospects</h1>
      <div class="card">
        <label>Find jobs for candidate</label>
        <select id="pCand" onchange="setFindJobsCandidate(this.value)">${D.candidates.map(c => `<option value="${esc(c.id)}" ${c.id===F.pCand?'selected':''}>${esc(c.name)} (${esc(c.id)})</option>`).join('')}</select>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" onclick="findJobs()">Find jobs</button>
          <span class="mut" style="margin-left:6px">Queue newest found:</span>
          ${[5, 10, 20].map(n => `<button class="btn approve" onclick="queueAll(${n})">${n}</button>`).join('')}
          <button class="btn approve" onclick="queueAll(0)">All</button>
          <span class="mut">${(() => { const n = D.prospects.filter(p => p.cand === F.pCand && p.status === 'Found').length; return n + ' found ready to queue'; })()}</span>
          <span class="mut" id="pMsg"></span>
        </div>
      </div>
      <div class="filters">
        <div><label>Candidate</label><select onchange="setFilter('prosCand',this.value)">${opts(cands, F.prosCand)}</select></div>
        <div><label>Status</label><select onchange="setFilter('prosStatus',this.value)">${opts(statuses, F.prosStatus)}</select></div>
        <div><label>Date found</label><select onchange="setFilter('prosSort',this.value)">
          <option value="newest" ${sort==='newest'?'selected':''}>Newest first</option>
          <option value="oldest" ${sort==='oldest'?'selected':''}>Oldest first</option>
        </select></div>
      </div>
      <div class="card"><table><tr><th>Found</th><th>Candidate</th><th>Company</th><th>Role</th><th>Source</th><th>Status</th><th>Link</th><th>Action</th></tr>` +
      (pageRows.length ? pageRows.map(p => `<tr>
        <td class="mut" style="white-space:nowrap" title="${esc(p.found ? new Date(p.found).toLocaleString('en-GB') : 'No date recorded')}">${esc(foundDay(p.found))}</td>
        <td class="mut">${esc(p.cand)}</td><td><b>${esc(p.company)}</b></td><td>${esc(p.title)}</td><td class="mut">${esc(p.source||'')}</td>
        <td>${chip(p.status)}</td><td>${p.url?`<a href="${esc(p.url)}">open</a>`:''}</td>
        <td>${p.status === 'Queued' ? '<span class="mut">queued</span>' :
          `<button class="btn approve tiny" onclick="prospectAction('${p.id}','Queued')">Queue</button>
           <button class="btn reject tiny" onclick="prospectAction('${p.id}','Skipped')">Skip</button>`}</td>
        </tr>`).join('') :
      '<tr><td colspan="8" class="mut">No prospects match. Use "Find jobs" above, or add rows manually in the Prospects tab of the sheet.</td></tr>') +
      '</table>' + (total ? pagerHtml(pg, 'prosPage', 'prosSize', [25, 50, 100]) : '') + '</div>';
  }
 
  if(view === 'followups'){
    const n = new Date(), pad = x => String(x).padStart(2, '0');
    const today = `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; // local date, like the server's due dates
    m.innerHTML = '<h1>Follow-ups</h1><div class="card"><table><tr><th>Type</th><th>Candidate</th><th>Company / role</th><th>Due</th><th>Status</th><th>Action</th></tr>' +
      (D.followUps.length ? D.followUps.map(f => {
        const dueDate = f.due || ''; // yyyy-MM-dd from dashData
        const overdue = f.status === 'Pending' && dueDate && dueDate <= today;
        return `<tr>
          <td>${esc(f.type)}</td><td class="mut">${esc(f.cand)}</td>
          <td><b>${esc(f.company)}</b><br><span class="mut">${esc(f.title)}</span></td>
          <td>${overdue ? `<span class="chip c-fail">${esc(dueDate)} - due</span>` : esc(dueDate)}</td>
          <td>${chip(f.status)}</td>
          <td>${f.status==='Pending'?`<button class="btn approve tiny" onclick="markFollowUpDone('${f.id}')">Mark done</button>`:'<span class="mut">-</span>'}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="6" class="mut">Nothing tracked yet. Every submitted application gets a follow-up here.</td></tr>') +
      '</table></div>';
  }
 
  if(view === 'accounts'){
    const accts = (D.accounts || []).slice().reverse();
    m.innerHTML = '<h1>Site accounts</h1><p class="mut">Accounts the extension created or signs in to for candidates on job sites that require one - one per candidate per site, reused on later applications there. Passwords are random per account and only shown on request, to authorised reviewers.</p>' +
      '<div class="card"><table><tr><th>Candidate</th><th>Site</th><th>Login email</th><th>Status</th><th>Notes</th><th></th></tr>' +
      (accts.length ? accts.map(a => `<tr>
        <td class="mut">${esc(a.cand)}</td><td><b>${esc(a.site)}</b></td><td>${esc(a.email)}</td>
        <td>${chip(a.status)}</td><td class="mut">${esc(a.notes||'')}</td>
        <td><button class="btn tiny" onclick="revealPassword('${esc(a.id)}')">Show password</button></td>
      </tr>`).join('') : '<tr><td colspan="6" class="mut">No site accounts yet. They appear here when the extension meets a sign-up or sign-in page.</td></tr>') +
      '</table></div>';
  }

  if(view === 'report'){
    const r = D.report;
    m.innerHTML = '<h1>Latest report</h1>' + (!r ? '<p class="mut">No report yet. Run runDailyReport() in Apps Script or wait for the 07:00 trigger.</p>' :
      `<p class="mut" style="margin-bottom:12px">${esc(r.period)} · ${esc(r.summary)}</p>
       <div class="grid">
         ${stat(r.metrics.applications_submitted,'Submitted')}
         ${stat(r.metrics.applications_started,'Started')}
         ${stat(r.metrics.success_rate_pct+'%','Success rate')}
         ${stat(r.metrics.interviews,'Interviews')}
         ${stat(r.metrics.interview_rate_pct+'%','Interview rate')}
         ${stat(r.metrics.offers,'Offers')}
         ${stat(r.metrics.avg_review_minutes+'m','Avg review time')}
         ${stat(r.metrics.prospects_found,'Prospects found')}
       </div>`);
  }
 
  if(view === 'log'){
    const actors = uniq(D.log.map(l => l.actor));
    const actions = uniq(D.log.map(l => l.action));
    let rows = D.log;
    if(F.logActor) rows = rows.filter(l => l.actor === F.logActor);
    if(F.logAction) rows = rows.filter(l => l.action === F.logAction);
    m.innerHTML = '<h1>Activity</h1>' +
      `<div class="filters">
        <div><label>Actor</label><select onchange="setFilter('logActor',this.value)">${opts(actors, F.logActor)}</select></div>
        <div><label>Action</label><select onchange="setFilter('logAction',this.value)">${opts(actions, F.logAction)}</select></div>
        <div style="flex:0"><label>&nbsp;</label><button class="btn danger" onclick="clearLog()">Clear log</button></div>
       </div>` +
      '<div class="card"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr>' +
      rows.map(l => `<tr><td class="mut">${esc(l.t).slice(0,24)}</td><td>${esc(l.actor)}</td><td><b>${esc(l.action)}</b></td><td class="mut">${esc(l.detail)}</td></tr>`).join('') +
      '</table></div>';
  }
 
  if(view === 'help'){ m.innerHTML = HELP_HTML; }
}
 
function stat(v,l){ return `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`; }
function pretty(j){ try { return JSON.stringify(JSON.parse(j), null, 2); } catch(e){ return j || ''; } }
 
/** One page of `rows`. The page is clamped so a filter, decision or refresh can't strand you on an empty page. */
function paginate(rows, pageKey, size){
  const pages = Math.max(1, Math.ceil(rows.length / size));
  F[pageKey] = Math.min(Math.max(1, F[pageKey] || 1), pages);
  const start = (F[pageKey] - 1) * size;
  return { rows: rows.slice(start, start + size), start, page: F[pageKey], pages, size, total: rows.length };
}

function pagerHtml(pg, pageKey, sizeKey, sizes){
  return `
    <div class="pager">
      <span class="mut">Showing ${pg.start + 1}-${pg.start + pg.rows.length} of ${pg.total}</span>
      <div class="pg">
        <button class="btn tiny" ${pg.page <= 1 ? 'disabled' : ''} onclick="setFilter('${pageKey}', ${pg.page - 1})">&lsaquo; Prev</button>
        <span class="mut">Page ${pg.page} of ${pg.pages}</span>
        <button class="btn tiny" ${pg.page >= pg.pages ? 'disabled' : ''} onclick="setFilter('${pageKey}', ${pg.page + 1})">Next &rsaquo;</button>
        <select onchange="setFilter('${sizeKey}', Number(this.value))">
          ${sizes.map(n => `<option value="${n}" ${n===pg.size?'selected':''}>${n} per page</option>`).join('')}
        </select>
      </div>
    </div>`;
}

// Review findings are fetched per card when opened (they can be 40 KB each), then kept for the session
const FINDINGS = {}, OPEN_FINDINGS = new Set();
function toggleFindings(id){
  if(OPEN_FINDINGS.has(id)) { OPEN_FINDINGS.delete(id); render(); return; }
  OPEN_FINDINGS.add(id);
  render();
  if(FINDINGS[id] != null) return;
  google.script.run
    .withSuccessHandler(r => { FINDINGS[id] = r.findings; render(); })
    .withFailureHandler(e => { OPEN_FINDINGS.delete(id); render(); toast('Error: ' + e.message); })
    .dashReviewFindings(DASH_KEY, id);
}

function renderFindings(findings){
  try {
    var parsed = JSON.parse(findings);
    if(Array.isArray(parsed)){
      var rows = parsed.map(function(f){
        var isUrl = typeof f.value === 'string' && /^https?:\/\//.test(f.value);
        var val = isUrl ? `<a href="${esc(f.value)}">${esc(f.value)}</a>` : esc(f.value);
        return `<div style="padding:3px 0;border-bottom:1px solid var(--line)"><b>${esc(f.label)}:</b> ${val}</div>`;
      }).join('');
      return `<div class="findings" style="font-family:'IBM Plex Sans'">${rows}</div>`;
    }
  } catch(e){ }
  return `<div class="findings">${esc(pretty(findings))}</div>`;
}
 
function setFilter(key, val){
  F[key] = val;
  if(!/Page$/.test(key)) { F.prosPage = 1; F.revPage = 1; } // any new filter, sort or page size starts back at page 1
  render();
}

/** "Today", "Yesterday", or a short date like "3 Oct" (year added when it isn't this year). */
function foundDay(ts){
  if(!ts) return '-';
  const d = new Date(ts), now = new Date();
  const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if(days === 0) return 'Today';
  if(days === 1) return 'Yesterday';
  const o = { day: 'numeric', month: 'short' };
  if(d.getFullYear() !== now.getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-GB', o);
}

function setFindJobsCandidate(candId) {
  F.pCand = candId;
  saveFindJobsCandidate(candId);
  render(); // refreshes the "found ready to queue" count; the selection is restored from storage
}
 
// The card leaves the queue as soon as you click; the sheet is updated in the
// background and the card comes back if that fails.
function decide(id, d){
  const t = D.reviews.find(x => x.id === id);
  if(!t) return;
  let notes = '';
  if(d === 'revise'){
    const isSub = t.type === 'Submission';
    notes = prompt(isSub
      ? 'Send back this application? It will NOT be submitted and shows as Rejected under Applications (Retry re-queues it).\n\nReason (optional):'
      : 'What should change? A new version is written from your notes plus the AI findings and comes back to this queue in a minute or two.\n\nNotes (optional):');
    if(notes === null) return; // cancelled
  }
  D.reviews = D.reviews.filter(x => x !== t);
  render();
  google.script.run
    .withSuccessHandler(r => {
      if(r && r.already) toast('Already decided by someone else (' + (r.decision || 'decided') + ')');
      else if(d === 'approve') toast(t.type === 'Submission' ? 'Approved - it is submitted shortly (by the worker, or by the extension tab that filled it)' : 'Approved');
      else toast(r && r.revising ? 'Sent back - a revised version is being written' : 'Sent back - not submitted');
      load(true);
    })
    .withFailureHandler(e => { D.reviews.push(t); render(); toast('Error: ' + e.message); })
    .dashDecide(DASH_KEY, id, d, notes);
}
 
function gen(){
  const jd = document.getElementById('gJD').value.trim();

function findJobs(){
  const candId = F.pCand || loadFindJobsCandidate() || document.getElementById('pCand').value;
  if(!candId) { toast('Please select a candidate first'); return; }
  saveFindJobsCandidate(candId);
  document.getElementById('pMsg').textContent = 'Searching…';
  google.script.run.withSuccessHandler(r => {
    document.getElementById('pMsg').textContent = `Found ${r.found}, added ${r.added} new.`;
    // After finding jobs, refresh the full data to get new prospects
    // but the candidate selection will be restored from localStorage
    load();
  }).withFailureHandler(e => { document.getElementById('pMsg').textContent = 'Error: ' + e.message; })
    .dashFindProspects(DASH_KEY, candId);
}
 
/** Queue the `limit` most recently found prospects for the selected candidate (0 = all of them). */
function queueAll(limit){
  const cand = F.pCand || loadFindJobsCandidate() || document.getElementById('pCand').value;
  if(!cand) { toast('Please select a candidate first'); return; }
  saveFindJobsCandidate(cand);

  const mine = D.prospects.filter(p => p.cand === cand);
  const foundCount = mine.filter(p => p.status === 'Found').length;
  const manualCount = mine.filter(p => p.status === 'Found - Manual Review').length;
  if(!mine.length) { toast('No prospects for this candidate yet. Try "Find jobs" first.'); return; }
  if(!foundCount) {
    toast(manualCount ? `Nothing to queue - all ${manualCount} need manual review (no supported ATS link)` : 'No "Found" prospects to queue.');
    return;
  }

  const n = limit > 0 ? Math.min(limit, foundCount) : foundCount;
  document.getElementById('pMsg').textContent = `Queuing ${n} of ${foundCount}…`;
  google.script.run
    .withSuccessHandler(r => {
      const ids = new Set(r.ids || []);
      D.prospects.forEach(p => { if(ids.has(p.id)) p.status = 'Queued'; });
      render();
      toast(r.queued
        ? `Queued ${r.queued}` + (r.remaining ? `, ${r.remaining} still Found` : '') + (r.manualReview ? ` (${r.manualReview} need manual review)` : '')
        : 'No prospects to queue.');
    })
    .withFailureHandler(e => { document.getElementById('pMsg').textContent = ''; toast('Error: ' + e.message); })
    .dashQueueAllFound(DASH_KEY, cand, limit || 0);
}
 
function prospectAction(id, status){
  const p = D.prospects.find(x => x.id === id);
  if(!p) return;
  const before = p.status;
  p.status = status; // show it straight away; the sheet is updated in the background
  render();
  toast(status);
  google.script.run
    .withFailureHandler(e => { p.status = before; render(); toast('Error: ' + e.message); })
    .dashSetProspectStatus(DASH_KEY, id, status);
}
 
function setActive(id, active){
  google.script.run.withSuccessHandler(() => { toast(active ? 'Activated' : 'Deactivated'); load(); })
    .withFailureHandler(e => toast('Error: ' + e.message)).dashSetCandidateActive(DASH_KEY, id, active);
}
 
function setTarget(id, val){

function delCandidate(id, name){
  if(!confirm(`Delete ${name} (${id}) and ALL their data - applications, prospects, generated documents, follow-ups, and their Drive folder? This cannot be undone.`)) return;
  toast('Deleting…');

function clearLog(){
  if(!confirm('Clear the entire Activity Log? This cannot be undone (it only clears the log, not your candidates or applications).')) return;
  google.script.run.withSuccessHandler(() => { toast('Log cleared'); load(); })
    .withFailureHandler(e => toast('Error: ' + e.message)).dashClearActivityLog(DASH_KEY);
}
 
function revealPassword(id){
  google.script.run.withSuccessHandler(r => {
    // prompt() keeps the password selectable for copying without putting it in the page
    prompt('Password for ' + r.email + ' on ' + r.site + ' (copy it, then close):', r.password);
  }).withFailureHandler(e => toast('Error: ' + e.message)).dashRevealAccountPassword(DASH_KEY, id);

function retryApp(id){
  if(!confirm('Re-queue this application as a fresh prospect to try again?')) return;
  google.script.run.withSuccessHandler(() => { toast('Re-queued'); load(); })
    .withFailureHandler(e => toast('Error: ' + e.message)).dashRetryApplication(DASH_KEY, id);
}
 
const HELP_HTML = `
<h1>Help &amp; guide</h1>
 
<div class="card">
<h2>What Jobverse does, in one line</h2>
<p class="mut">It finds jobs for your candidates, writes a tailored CV and cover letter for each, fills in the online application, and pauses so a human can approve before anything is submitted. Nothing is ever sent to an employer without someone clicking Approve.</p>
</div>
 
<div class="card">
<h2>The everyday workflow (hands-off path)</h2>
<ol class="steps">
<li>A candidate fills in the Google form. Within seconds they appear under <b>Candidates</b>, already profiled by the AI.</li>
<li>Every morning the system finds new jobs for each active candidate. You can also do it now: <b>Prospects</b> tab, pick the candidate, click <b>Find jobs</b>.</li>
<li>In <b>Prospects</b>, click <b>Queue</b> on the jobs you want, or use <b>Queue newest found: 5 / 10 / 20 / All</b> to queue a batch of the most recently found ones.</li>
<li>That's it - the background worker checks for queued jobs automatically (about every 30 seconds) and fills each one in, one after another. Nobody needs to click anything for this step.</li>
<li>Each finished application lands in <b>Review queue</b>. Read it, then <b>Approve</b> or <b>Send back</b>. Sending back a CV, cover letter or NHS statement has a new version written from your notes, which comes back to the queue in a minute or two. Sending back a finished application means it is not submitted; it shows as Rejected under Applications, where <b>Retry</b> re-queues it.</li>
<li>On approve, it's submitted for real (by the worker, or by the extension if you filled it manually) and a screenshot is saved. See it under <b>Applications</b>.</li>
</ol>
</div>
 
<div class="card">
<h2>Scenario: background automation (the worker)</h2>
<p class="mut">This is what actually does the filling described above. It runs on a machine somewhere (started with <code>npm start</code> in the <code>worker</code> folder of the Jobverse repo) and polls continuously - no one needs to be watching it. When it finds something Queued, it generates the CV/cover letter, fills the real application form in a live browser, and stops to request a human decision in the Review queue, exactly like everything else in Jobverse. It only clicks the real Submit button after someone approves that item - nothing skips the review step just because a person didn't type the URL in themselves.</p>
<p class="mut"><b>What it can handle right now:</b> any application form it can reach without an account - it finds the form (including forms embedded in an iframe), uploads the CV and cover letter, answers each question from the candidate's data, and follows Next through multi-step forms. It never presses Submit while filling. Anything it can't answer is listed in the review item. Jobs behind a sign-in or sign-up page, and anything that fails, end as <b>Error</b> in Prospects (the reason is in Notes) - run those through the extension, or re-queue them.</p>
<p class="mut">After you approve, the worker re-fills the form and submits it. If it can't see the employer's confirmation message afterwards, the application shows as <b>Submit Unconfirmed - Human Needed</b> and reviewers are emailed - check the employer's site before doing anything else, as it may well have gone through.</p>
</div>
 
<div class="card">
<h2>Scenario: a single job you already have open</h2>
<p class="mut">Use the Chrome extension directly when you want something done right now instead of waiting for the worker's next pass - or for a job behind a sign-in/sign-up page, which only the extension handles. Open the extension on the job posting, pick the candidate, and click <b>Apply to this job</b>. Same review-then-submit flow, just for that one job.</p>
</div>
 
<div class="card">
<h2>Scenario: NHS applications</h2>
<p class="mut">NHS Jobs currently goes through the extension's general driver, like any other site. The dedicated NHS flow (AI-written supporting statement, automatic Trac claim/verify follow-up) is not switched on yet, so add the Trac follow-up yourself after submitting. The five legal declaration sections (criminal convictions, fitness to practice, guaranteed interview scheme, equality/diversity, socio-economic background) must come from the candidate's own answers in their Candidates row (columns starting "NHS...") - check them carefully in the review item before approving.</p>

<div class="card">

<li class="faq"><b>Set a total goal:</b> the Target field in Candidates. The system stops applying once they hit it. 0 means no cap.</li>

</ul>

<div class="card">

<details class="faq"><summary>A candidate's prospects came back empty. Why?</summary>

<details class="faq"><summary>Something says "Found - Manual Review" instead of Found.</summary>
<p>The job's link didn't point at a supported application system. Open it, find the real apply page, and paste that URL into the Prospects tab's JobURL column if you want the extension to handle it.</p></details>

<p>Candidates tab, <b>Delete</b> button. It removes them and everything linked to them - applications, prospects, documents, follow-ups, and their Drive folder - in one action. It asks you to confirm first and cannot be undone.</p></details>
<details class="faq"><summary>The dashboard feels slow.</summary>
<p>It runs entirely on Google's servers with the sheet as its database, so each action is a round-trip - a second or two is normal. It's the trade-off for having no server to host or pay for.</p></details>
<details class="faq"><summary>Is anything ever submitted without a human?</summary>
<p>No. Every application pauses in the Review queue and only submits after someone clicks Approve - whether it was filled by the worker or by someone using the extension directly.</p></details>
<details class="faq"><summary>What brings an item into the Review queue?</summary>
<p>Every time the Resume Builder or Cover Letter Builder generates a document, a second AI - the Reviewer Agent - checks it for things like claims the CV makes that aren't backed up by the candidate's actual background, and keywords from the job posting that are missing. That review lands in the queue with Status: Awaiting Human, along with its score and findings, and stays there until someone opens it and decides. There's a separate, second checkpoint too: right before an application would actually be submitted, a full snapshot of everything about to be sent is filed and also waits for a human Approve. Nothing skips either queue on its own. (If auto-decide is ever turned on for CV/CoverLetter/NHSStatement reviews specifically - a config setting, off by default - a document that clears a confidence bar gets decided automatically instead of waiting. That never applies to the final submission checkpoint, which always waits for a person.)</p></details>

<p>Yes. The worker can't get past sign-in or sign-up pages; the extension creates and signs in to site accounts itself (see <b>Site accounts</b>). Keep it set up.</p></details>
<details class="faq"><summary>A job needs an account on the employer's site. What happens?</summary>
<p>In the extension: it creates an account for the candidate with their application email and a random password (one per candidate per site, saved under <b>Site accounts</b>), or signs in to the one it made before. If the site wants a CAPTCHA solved or an email verified, it asks a person to do that step and carries on. The worker doesn't handle accounts - those jobs end as Error there.</p></details>
</div>
